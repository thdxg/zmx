name: Test

# Fork-owned. Builds zmx and runs its Zig tests and its bats tests on every
# pull request and every push to main, so a change is proven on CI before
# build-zmx.yml publishes it. Nobody has to build zmx on a dev machine: the
# macOS 27 SDK breaks the native build there, and a cross build for Linux
# takes minutes and still needs a container to run.
#
# Linux runs the tests natively. macOS is where the published binary runs
# and where change 0004 (see DOWNSTREAM.md) runs, so it runs the tests too and
# compiles the x86_64 slice that build-zmx.yml lipos in.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15, as build-zmx.yml: its Xcode is older than the 26.4 build
        # that breaks zig#31658 on dev machines.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          # Keep in step with build-zmx.yml and minimum_zig_version in
          # build.zig.zon.
          version: 0.17.1

      - name: Run the tests
        run: zig build test --summary all

      # Some tests run `timeout`, which macOS does not have. coreutils
      # gives it.
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bats-core coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -q
            sudo apt-get install -y -q bats
          fi

      - name: Build zmx
        run: zig build

      # leader.bats runs claim_leader.py. A skipped test fails the step, so a
      # missing tool cannot hide a test. daemon_responsibility.bats tests a
      # macOS concept, so Linux leaves it out. The short TMPDIR keeps the
      # session socket paths under the macOS limit of 104 bytes.
      - name: Run the bats tests
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          files=()
          for f in test/*.bats; do
            if [ "$RUNNER_OS" != macOS ] && [ "$f" = test/daemon_responsibility.bats ]; then
              continue
            fi
            files+=("$f")
          done
          bats --tap "${files[@]}" | tee bats.tap
          if grep -qE '^ok [0-9]+ .* # skip' bats.tap; then
            echo "::error::A bats test was skipped."
            exit 1
          fi

      - name: Build the x86_64 slice
        if: runner.os == 'macOS'
        run: zig build -Dtarget=x86_64-macos --prefix zig-out-x86_64
